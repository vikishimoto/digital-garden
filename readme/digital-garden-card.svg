<svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="bgLeft" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b1560" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgRight" cx="85%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#0f5132" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0a12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6e6ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="700" height="260" rx="18" fill="#0a0a12"/>
  <rect x="0" y="0" width="700" height="260" rx="18" fill="url(#bgLeft)"/>
  <rect x="0" y="0" width="700" height="260" rx="18" fill="url(#bgRight)"/>

  <!-- stars -->
  <g fill="#8fd3ff" opacity="0.8">
    <circle cx="60" cy="40" r="1.4"/>
    <circle cx="120" cy="90" r="1"/>
    <circle cx="200" cy="30" r="1.2"/>
    <circle cx="260" cy="70" r="1"/>
    <circle cx="340" cy="25" r="1.3"/>
    <circle cx="420" cy="55" r="1"/>
    <circle cx="500" cy="35" r="1.4"/>
    <circle cx="560" cy="80" r="1"/>
    <circle cx="620" cy="45" r="1.2"/>
    <circle cx="90" cy="200" r="1.2"/>
    <circle cx="180" cy="220" r="1"/>
    <circle cx="480" cy="210" r="1.3"/>
    <circle cx="560" cy="190" r="1"/>
    <circle cx="630" cy="220" r="1.2"/>
    <circle cx="350" cy="200" r="1"/>
  </g>
  <g stroke="#5fa8d3" stroke-width="0.4" opacity="0.35">
    <line x1="60" y1="40" x2="120" y2="90"/>
    <line x1="120" y1="90" x2="200" y2="30"/>
    <line x1="500" y1="35" x2="560" y2="80"/>
    <line x1="560" y1="80" x2="620" y2="45"/>
  </g>

  <!-- outer border -->
  <rect x="2" y="2" width="696" height="256" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- left hexagon -->
  <g transform="translate(80,130)" filter="url(#glow)">
    <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="#0d0d1a" stroke="#4fd6ff" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="20" fill="#4fd6ff" font-weight="bold">&lt;/&gt;</text>
  </g>

  <!-- right hexagon (leaf motif for Digital Garden) -->
  <g transform="translate(620,130)" filter="url(#glow)">
    <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="#0d0d1a" stroke="#4fe07f" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" font-size="22">🌱</text>
  </g>

  <!-- title -->
  <text x="350" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="url(#titleGrad)">Digital Garden</text>

  <!-- subtitle -->
  <text x="350" y="155" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#b58bff" font-style="italic">My personal space to grow ideas and code</text>

</svg>
