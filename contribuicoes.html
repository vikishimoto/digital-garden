<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contribuições — Catedral Manancial da Palavra</title>
<meta name="description" content="Contribua com a obra da Catedral Manancial da Palavra através do PIX." />
<link rel="icon" href="assets/img/favicon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="contribuicoes">

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="page-hero__inner">
      <p class="eyebrow">Generosidade</p>
      <h1>Seja um Pilar dessa Obra</h1>
      <p class="lede">Sua contribuição sustenta o avanço do Reino através da Catedral Manancial da Palavra.</p>
    </div>
  </section>

  <section class="giving">
    <div class="container">
      <div class="giving__inner reveal">
        <p class="lede" style="text-align:center;">Cada semente plantada aqui se transforma em vidas alcançadas, famílias restauradas e uma obra que continua crescendo.</p>

        <div class="giving__pix">
          <p class="giving__pix-label">Chave PIX (CNPJ)</p>
          <p class="giving__pix-key">42.013.257/0001-28</p>

          <button class="btn btn--primary" data-copy-pix="42.013.257/0001-28">Copiar Chave PIX</button>
          <p class="giving__feedback" data-copy-feedback role="status" aria-live="polite"></p>

          <div class="giving__qr placeholder-img" style="margin-top:0.5rem;">
            <span class="placeholder-img__label" style="font-size:0.6rem;">[QR CODE]</span>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
